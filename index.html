<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Frogger</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div id="touch-controls">
      <button class="tc-btn" data-dir="up" aria-label="Up">▲</button>
      <div class="tc-row">
        <button class="tc-btn" data-dir="left" aria-label="Left">◀</button>
        <button class="tc-btn" data-dir="down" aria-label="Down">▼</button>
        <button class="tc-btn" data-dir="right" aria-label="Right">▶</button>
      </div>
    </div>
  </div>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
